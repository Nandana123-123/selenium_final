
name: Selenium Tests and Docker Hub Publish

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download project from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Install Chrome
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      # Step 4: Run Selenium tests
      - name: Run Selenium TestNG Tests
        run: mvn clean test

      # Step 5: Login to Docker Hub using GitHub Secrets
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Build and publish Docker image
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:latest
